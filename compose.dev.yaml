services:
  app:
    image: lsky-pro:dev
    build:
      target: development
      args:
        LOCAL_UID: "${LOCAL_UID:-1000}"
        LOCAL_GID: "${LOCAL_GID:-1000}"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www/html
      - lsky-vendor:/var/www/html/vendor

volumes:
  lsky-vendor:
