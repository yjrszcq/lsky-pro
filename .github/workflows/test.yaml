name: Container tests

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image after tests pass
        type: boolean
        default: false
      version:
        description: Image version tag (required when publishing)
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate publishing version
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$IMAGE_VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::A valid image version tag is required when publishing.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build PHP 8.5.12 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          load: true
          tags: lsky-pro:dev
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
      - name: Build protocol fixtures
        run: docker compose -p lsky-ci -f compose.test.yaml build fixtures
      - name: SQLite and real service integrations
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm tests
      - name: MySQL 8.4 regression tests
        env:
          TEST_DB_CONNECTION: mysql
          TEST_DB_DATABASE: lsky
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm tests
      - name: PostgreSQL 16 regression tests
        env:
          TEST_DB_CONNECTION: pgsql
          TEST_DB_HOST: postgres
          TEST_DB_PORT: '5432'
          TEST_DB_DATABASE: lsky
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm tests
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: lsky-pro:latest
          cache-from: |
            type=gha,scope=development
            type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Production HTTP, browser and persistence acceptance
        run: python3 tests/docker/acceptance.py --browser
      - name: Clean up test containers
        if: always()
        run: |
          docker compose -p lsky-ci -f compose.test.yaml down --volumes

  publish:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    uses: ./.github/workflows/docker.yaml
    with:
      version: ${{ github.event_name == 'push' && format('sha-{0}', github.sha) || inputs.version }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
