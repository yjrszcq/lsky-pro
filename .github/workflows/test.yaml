name: Container tests

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image after tests pass
        type: boolean
        default: false
      version:
        description: Image version tag (leave empty to use VERSION)
        type: string
        required: false
        default: '2.1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect VERSION changes in push
        id: version_changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git hash-object -w -t tree /dev/null)"
          elif ! git cat-file -e "${BEFORE}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          files="$(git diff --name-only "$BEFORE" "$AFTER" -- VERSION)"
          changed=false
          if [[ -n "$files" ]]; then
            changed=true
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build PHP 8.5.12 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          load: true
          tags: lsky-pro:dev
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
      - name: Build protocol fixtures
        run: docker compose -p lsky-ci -f compose.test.yaml build fixtures
      - name: SQLite and real service integrations
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm lsky-pro
      - name: MySQL 8.4 regression tests
        env:
          TEST_DB_CONNECTION: mysql
          TEST_DB_DATABASE: lsky
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm lsky-pro
      - name: PostgreSQL 16 regression tests
        env:
          TEST_DB_CONNECTION: pgsql
          TEST_DB_HOST: postgres
          TEST_DB_PORT: '5432'
          TEST_DB_DATABASE: lsky
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm lsky-pro
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: lsky-pro:latest
          cache-from: |
            type=gha,scope=development
            type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Production HTTP, browser and persistence acceptance
        run: python3 tests/docker/acceptance.py --browser
      - name: Clean up test containers
        if: always()
        run: |
          docker compose -p lsky-ci -f compose.test.yaml down --volumes

  publish:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test.outputs.version_changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    uses: ./.github/workflows/docker.yaml
    with:
      version: ${{ inputs.version }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
