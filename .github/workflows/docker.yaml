name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
    secrets:
      DOCKER_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag (leave empty to use VERSION)
        required: false
        type: string
        default: '2.1'

env:
  IMAGE_OWNER: szcq
  IMAGE_NAME: lsky-pro

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(cat VERSION)}"
          if ! [[ "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::VERSION or the supplied version must be a valid image tag.'
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          provenance: mode=max
          sbom: true
