name: Container tests

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build PHP 8.5.12 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: development
          load: true
          tags: lsky-pro:dev-php8.5.12
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
      - name: Build protocol fixtures
        run: docker compose -p lsky-ci -f compose.test.yaml build fixtures
      - name: SQLite and real service integrations
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm tests
      - name: MySQL 8.4 regression tests
        env:
          TEST_DB_CONNECTION: mysql
          TEST_DB_DATABASE: lsky
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm tests
      - name: PostgreSQL 16 regression tests
        env:
          TEST_DB_CONNECTION: pgsql
          TEST_DB_HOST: postgres
          TEST_DB_PORT: '5432'
          TEST_DB_DATABASE: lsky
        run: docker compose -p lsky-ci -f compose.test.yaml run --rm tests
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: lsky-pro:php8.5.12
          cache-from: |
            type=gha,scope=development
            type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Production HTTP, browser and persistence acceptance
        run: python3 tests/docker/acceptance.py --browser
      - name: Clean up test containers
        if: always()
        run: |
          docker compose -p lsky-ci -f compose.test.yaml down --volumes

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          provenance: mode=max
          sbom: true
