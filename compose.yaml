services:
  lsky-pro:
    image: szcq/lsky-pro:latest
    container_name: lsky-pro
    ports:
      - "${LSKY_PORT:-8089}:8089"
    environment:
      APP_URL: "${LSKY_URL:-http://localhost:8089}"
    volumes:
      - lsky-data:/var/www/html/storage
    restart: unless-stopped

volumes:
  lsky-data:
